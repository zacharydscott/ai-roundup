# Cloudflare Workers Static Assets configuration.
#
# There is no build step and no Worker code. `ai-roundup site build` (and every
# `run` / `apply`) writes finished HTML into pages/, that directory is
# committed, and `npx wrangler deploy` uploads it. Cloudflare never compiles
# Haskell, never installs a toolchain, and a deploy cannot fail in a way a local
# `site build` would not have caught first — what is in the repo is exactly what
# is served.
#
# __Why Workers and not Pages.__ The Git integration provisioned this repo as a
# Workers Build: it defaults the deploy command to `npx wrangler deploy`, it
# will not accept an empty deploy command, and the API token it injects into the
# build environment is scoped for Workers. A `wrangler pages deploy` from that
# environment fails with `Authentication error [code: 10000]` against
# /pages/projects/ — the token cannot reach Pages at all. Rather than issue a
# hand-made token with Pages:Edit and store it as a build variable to work
# around the pipeline's own credentials, the config matches the pipeline.
#
# Dashboard settings this expects, under Settings → Build:
#
#   Build command    (empty)
#   Deploy command   npx wrangler deploy
#   Root directory   /
#
# There is deliberately no `main` key. A Worker whose only content is static
# assets needs no script, and adding one would put code in the request path of
# every page for no reason.

name = "ai-roundup"
compatibility_date = "2026-08-28"

[assets]
directory = "./pages"

# /roundups/2026-08-31 serves roundups/2026-08-31.html, so the addresses in a
# link or a mail carry no file extension.
html_handling = "auto-trailing-slash"

# An unmatched path is served pages/404.html, which the site generator writes
# and keeps current with the archive. Every wrong URL here is someone guessing
# at a date, and that page answers the guess with the days that do exist.
not_found_handling = "404-page"
