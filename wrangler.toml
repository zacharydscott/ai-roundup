# Cloudflare Pages configuration.
#
# There is no build command on purpose. `ai-roundup site build` (and every
# `run` / `apply`) writes finished HTML into pages/, that directory is
# committed, and Cloudflare serves it as-is. Cloudflare never compiles Haskell,
# never installs a toolchain, and a deploy cannot fail in a way a local build
# would not have caught first — what is in the repo is exactly what is served.
#
# To connect this the first time: Cloudflare dashboard → Workers & Pages →
# Create → Pages → Connect to Git → pick this repo. Leave the framework preset
# as "None" and the build command empty; this file supplies the output
# directory. Every push to the production branch then deploys.

name = "ai-roundup"
compatibility_date = "2026-08-31"
pages_build_output_dir = "pages"

# Static assets only. `html_handling` lets /roundups/2026-08-31 serve
# roundups/2026-08-31.html, so the URLs in a link or a mail do not carry a file
# extension. `not_found_handling` sends an unknown path to the archive rather
# than to Cloudflare's default 404, because every wrong URL here is someone
# guessing at a date and the archive is the answer to that guess.
[assets]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
